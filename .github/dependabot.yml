version: 2
updates:
  # npm dependencies — grouped so it's at most a couple of PRs a week, not noise.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # eslint-config-next does not load under eslint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler and needs its own migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node should follow the Node major the site runs on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # keep GitHub Actions current; the workflows use major-version tags, not hashes
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
